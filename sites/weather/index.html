<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toronto Daily Weather</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            margin-top: 0;
            color: #2c3e50;
        }
        .temperature {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
            color: #e74c3c;
        }
        .details {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #weather-content {
            display: none;
        }
        .error {
            color: #e74c3c;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Toronto Weather</h1>
        <div id="loader" class="loader"></div>
        <div id="error" class="error">Failed to load weather data. Please try again later.</div>
        
        <div id="weather-content">
            <div id="current-temp" class="temperature">--°C</div>
            <div id="weather-desc" class="details">--</div>
            <div id="high-low" class="details">High: --°C | Low: --°C</div>
            <div class="details" style="font-size: 14px; margin-top: 10px;">
                Data provided by Open-Meteo
            </div>
        </div>
    </div>

    <script>
        // WMO Weather interpretation codes (https://open-meteo.com/en/docs)
        const weatherCodes = {
            0: "Clear sky",
            1: "Mainly clear",
            2: "Partly cloudy",
            3: "Overcast",
            45: "Fog",
            48: "Depositing rime fog",
            51: "Light drizzle",
            53: "Moderate drizzle",
            55: "Dense drizzle",
            56: "Light freezing drizzle",
            57: "Dense freezing drizzle",
            61: "Slight rain",
            63: "Moderate rain",
            65: "Heavy rain",
            66: "Light freezing rain",
            67: "Heavy freezing rain",
            71: "Slight snow fall",
            73: "Moderate snow fall",
            75: "Heavy snow fall",
            77: "Snow grains",
            80: "Slight rain showers",
            81: "Moderate rain showers",
            82: "Violent rain showers",
            85: "Slight snow showers",
            86: "Heavy snow showers",
            95: "Thunderstorm",
            96: "Thunderstorm with slight hail",
            99: "Thunderstorm with heavy hail"
        };

        async function fetchWeather() {
            try {
                // Toronto Coordinates: 43.7001, -79.4163
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=43.7001&longitude=-79.4163&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FToronto');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                const currentTemp = data.current_weather.temperature;
                const weatherCode = data.current_weather.weathercode;
                const maxTemp = data.daily.temperature_2m_max[0];
                const minTemp = data.daily.temperature_2m_min[0];

                document.getElementById('current-temp').innerText = `${Math.round(currentTemp)}°C`;
                document.getElementById('weather-desc').innerText = weatherCodes[weatherCode] || "Unknown Conditions";
                document.getElementById('high-low').innerText = `High: ${Math.round(maxTemp)}°C | Low: ${Math.round(minTemp)}°C`;

                document.getElementById('loader').style.display = 'none';
                document.getElementById('weather-content').style.display = 'block';
            } catch (error) {
                console.error('Error fetching weather:', error);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        }

        fetchWeather();
    </script>
</body>
</html>
